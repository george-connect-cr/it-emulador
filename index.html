<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Asistencia • epark</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c0f;
      --surface: #111317;
      --border: rgba(255,255,255,0.07);
      --accent: #f0c040;
      --accent-glow: rgba(240,192,64,0.35);
      --accent-dim: rgba(240,192,64,0.12);
      --text: #f0ede8;
      --muted: rgba(240,237,232,0.38);
      --danger: #e05555;
      --danger-glow: rgba(224,85,85,0.4);
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0;
    }

    /* ─── Noise overlay ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Header ─── */
    header {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 28px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,12,15,0.85);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    .logo span {
      color: var(--text);
      opacity: 0.55;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(240,192,64,0.25);
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* ─── Main ─── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 0;
      padding: 32px 24px;
    }

    .status-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(240,192,64,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }

    .status-ring::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(240,192,64,0.08);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4caf7d;
      box-shadow: 0 0 8px rgba(76,175,125,0.8);
      animation: pulse-dot 2.4s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.7; }
    }

    .headline {
      font-family: 'Syne', sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: var(--text);
    }

    .subtext {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
      max-width: 260px;
      margin-bottom: 52px;
    }

    /* ─── Button ─── */
    .btn-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Orbit ring */
    .orbit {
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      border: 1px dashed rgba(240,192,64,0.18);
      animation: spin 18s linear infinite;
      pointer-events: none;
    }

    .orbit::after {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Pulse halo */
    .halo {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: var(--accent-glow);
      filter: blur(32px);
      animation: breathe 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .btn-help {
      position: relative;
      z-index: 2;
      width: 158px;
      height: 158px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: conic-gradient(from 135deg, #f0c040, #e07a20, #f0c040);
      box-shadow:
        0 0 0 4px rgba(240,192,64,0.15),
        0 0 40px rgba(240,192,64,0.3),
        0 12px 48px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s cubic-bezier(.4,0,.2,1),
                  box-shadow 0.12s cubic-bezier(.4,0,.2,1);
      -webkit-tap-highlight-color: transparent;
      outline: none;
      user-select: none;
    }

    .btn-help:active {
      transform: scale(0.93);
      box-shadow:
        0 0 0 6px rgba(240,192,64,0.25),
        0 0 60px rgba(240,192,64,0.55),
        0 6px 24px rgba(0,0,0,0.7);
    }

    .btn-help svg {
      width: 42px;
      height: 42px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    .btn-label {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #1a1200;
    }

    /* ─── Calling overlay ─── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(10,12,15,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .calling-ring {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 32px;
    }

    .calling-ring .r {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(240,192,64,0.5);
      animation: expand 2.2s ease-out infinite;
    }
    .calling-ring .r:nth-child(2) { animation-delay: 0.6s; }
    .calling-ring .r:nth-child(3) { animation-delay: 1.2s; }

    @keyframes expand {
      0%   { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .calling-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 32px var(--accent-glow);
    }

    .calling-icon svg {
      width: 52px;
      height: 52px;
    }

    .call-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .call-number {
      font-size: 0.9rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .call-status {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 48px;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .btn-cancel {
      background: rgba(224,85,85,0.12);
      border: 1px solid rgba(224,85,85,0.3);
      color: var(--danger);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 14px 36px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .btn-cancel:active {
      background: rgba(224,85,85,0.22);
      box-shadow: 0 0 20px var(--danger-glow);
    }

    /* ─── Footer ─── */
    footer {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 16px 28px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-top: 1px solid var(--border);
    }

    .footer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4caf7d;
      box-shadow: 0 0 6px rgba(76,175,125,0.7);
    }

    footer span {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">e<span>park</span></div>
    <div class="badge">Asistencia 24/7</div>
  </header>

  <main>
    <div class="status-ring">
      <div class="status-dot"></div>
    </div>

    <h1 class="headline">¿Necesitás<br>ayuda?</h1>
    <p class="subtext">Un agente de asistencia está disponible para atenderte de inmediato.</p>

    <div class="btn-wrap">
      <div class="halo"></div>
      <div class="orbit"></div>
      <button class="btn-help" onclick="solicitarAyuda()" aria-label="Solicitar ayuda">
        <!-- Phone icon -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.47 11.47 0 003.59.57 1 1 0 011 1V20a1 1 0 01-1 1C5.64 21 3 18.36 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.01l-2.2 2.21z" fill="#1a1200"/>
        </svg>
        <span class="btn-label">Ayuda</span>
      </button>
    </div>
  </main>

  <footer>
    <div class="footer-dot"></div>
    <span>Sistema activo • Cobertura nacional</span>
  </footer>

  <!-- Calling overlay -->
  <div class="overlay" id="overlay">
    <div class="calling-ring">
      <div class="r"></div>
      <div class="r"></div>
      <div class="r"></div>
      <div class="calling-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.47 11.47 0 003.59.57 1 1 0 011 1V20a1 1 0 01-1 1C5.64 21 3 18.36 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.01l-2.2 2.21z" fill="#1a1200"/>
        </svg>
      </div>
    </div>

    <p class="call-title">Conectando con asistencia…</p>
    <p class="call-number">25046000</p>
    <p class="call-status">Marcando</p>

    <button class="btn-cancel" onclick="cancelarLlamada()">Cancelar llamada</button>
  </div>

  <script>
    function solicitarAyuda() {
      // Número con DTMF: 25046000 pausa (#) luego 1
      const numero = 'tel:25046000%231';

      // Mostrar overlay
      const overlay = document.getElementById('overlay');
      overlay.classList.add('active');

      // Abrir marcador nativo del dispositivo
      setTimeout(() => {
        window.location.href = numero;
      }, 400);

      // Ocultar overlay si el usuario vuelve a la app
      document.addEventListener('visibilitychange', function handler() {
        if (document.visibilityState === 'visible') {
          overlay.classList.remove('active');
          document.removeEventListener('visibilitychange', handler);
        }
      });
    }

    function cancelarLlamada() {
      document.getElementById('overlay').classList.remove('active');
    }
  </script>

</body>
</html>
